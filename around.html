<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周邊環境｜白宮行館</title>
    <style>
        html, body{ height:100%; }
        body{
            font-family:-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
            margin:0; padding:12px; background:#f4f5f7;
            box-sizing:border-box;
            display:flex; flex-direction:column;
        }


        .site-nav {
             display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 16px;
            padding: 8px 8px 14px;
            border-bottom: 2px solid #111;
            margin: 0 0 12px;
            background:#fff;
            flex:0 0 auto;
        }

        .site-nav a {
            text-align: center;
            text-decoration: none;
            color: #111;
            font-size: clamp(20px, 3.6vw, 32px);
            letter-spacing: 0.16em;
            line-height: 1.35;
        }

        .site-nav a.is-current {
            color: #c8c8c8;
        }

        .lede {
            margin: 0 0 14px;
            font-size: 16px;
            line-height: 1.8;
        }

        .photos {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 10px;
            margin-bottom: 28px;
        }

        .photo {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            font-size: 32px;
            letter-spacing: 0.2em;
            background: #fff;
        }

        .photo img,
        .map-frame iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 0;
            display: block;
            padding-bottom:30px;
        }

       .map-label {
    margin: 0 0 12px;
    font-size: 16px;        
    display: flex;
    gap: 28px;              /* 兩個連結之間的距離 */
    flex-wrap: wrap;
}
.map-label a {
    color: #333;
}

        .map-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 360px;
            font-size: 36px;
            letter-spacing: 0.08em;
            overflow: hidden;
        }

        .back-to-top {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 50;
            padding: 10px 14px;
            border: 1px solid #111;
            background: #fff;
            color: #111;
            font: inherit;
            font-size: 13px;
            letter-spacing: 0.04em;
            cursor: pointer;
            text-decoration: none;
        }

        .back-to-top:hover {
            background: #111;
            color: #fff;
        }
#google_translate_element{
         position: fixed;
            right: 20px;
            bottom: 68px;
            z-index: 51;
        }
        
       
    </style>
     <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

 <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'zh-TW', // 網站原始語言
        includedLanguages: 'en,ja,ko,zh-CN,tl,id,vi,es,ar,de,fr', // 允許切換的語言 (以逗號隔開)
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>


</head>
<body>
<div id="google_translate_element"></div>
    <div class="page">
        <nav class="site-nav" aria-label="頁面">
            <a href="index.html">設備說明</a>
            <a href="map.html">場域地圖</a>
            <a class="is-current" href="around.html" aria-current="page">周邊環境</a>
        </nav>

        <p class="lede">可選擇步行或駕車的方式外出。請注意來車及交通安全</p>

        <div class="photos">
            <div class="photo"><img src="a01.png"></div>
            <div class="photo"><img src="a02.png"></div>
        </div>

        <p class="map-label"><a href="https://maps.app.goo.gl/SL9a1c9L784Xfzto8" target="_blank">商店 / 加油站</a><a href="https://maps.app.goo.gl/JW3H9NCe6vMZJ3eYA" target="_blank">餐廳</a></p>
        <div class="map-frame">
            <iframe
                title="商店與加油站地圖"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps?q=白宮行館沙灘溫泉度假村&hl=zh-TW&z=15&output=embed">
            </iframe>
        </div>
    </div>

    <a class="back-to-top" href="#top">Back to top</a>
    <script>
        document.documentElement.id = "top";
        document.querySelector(".back-to-top").addEventListener("click", (event) => {
            event.preventDefault();
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
</body>
</html>
